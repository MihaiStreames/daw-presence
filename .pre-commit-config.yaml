fail_fast: true

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 0
      - id: mixed-line-ending
        args: [--fix=lf]
        priority: 0

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        priority: 0

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273  # frozen: v3.9.10
    hooks:
      - id: prettier
        types_or: [json, yaml]
        priority: 2

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        types: [shell]
        priority: 2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        priority: 2

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
        priority: 0

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
        priority: 0

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --fix --allow-dirty --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        priority: 1

      - id: taplo
        name: taplo fmt
        entry: uvx taplo fmt
        language: system
        types: [toml]
        priority: 1
